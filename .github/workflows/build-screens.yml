name: Build screens and publish

on:
  schedule:
    # Every 3 hours (UTC). GitHub sometimes starts scheduled runs hours late;
    # the web page shows how old the data is.
    - cron: "17 */3 * * *"
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "screens.md"
      - "generator/**"
      - "site/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - run: pip install -r generator/requirements.txt

      - name: Generate the screens (English + Turkish)
        run: python generator/generate.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
